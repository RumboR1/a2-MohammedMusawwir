<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2: Poetry Entry Syrian</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <h1>Poetry Entry System</h1>
   
    <form id="poem-form">
      <label for="author">Author</label>
      <input type="text" id="author" required>
   
      <label for="title">Title</label>
      <input type="text" id="title" required>
   
      <label for="maqams">Maqam(s) (separate with commas if more than one)</label>
      <input type="text" id="maqams" required>
   
      <label for="birthYear">Author's birth year</label>
      <input type="number" id="birthYear" required>
   
      <button type="submit">Add Poem</button>
    </form>
   
    <h2>All Poems</h2>
    <table id="poem-table">
      <thead>
        <tr>
          <th>Author</th>
          <th>Title</th>
          <th>Maqam</th>
          <th>Era</th>
          <th>Mood</th>
          <th>Multiple Maqams?</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="poem-rows">
      </tbody>
    </table>
   
    <script src="js/main.js"></script>
  </body>
  </html>
